<div class="header-container">
    <div class="logo-section">
        <img src="assets/logos/notion-icon.png" alt="Flowboard Logo" class="logo">
        <span class="app-name">Flowboard</span>
    </div>

    <div class="user-information-section">
        <img src="assets/icons/bell.png" alt="Notification" class="notification-icon">
        <div class="user-profile">
            <app-default-avatar [name]="'John Doe'" [size]="32" [fontSize]="14"></app-default-avatar>
            <span class="user-name">John Doe</span>
        </div>
    </div>
</div>

<div class="header-container">
    <div class="logo-section">
        <img src="assets/logos/notion-icon.png" alt="Flowboard Logo" class="logo" (click)="goToHome()">
        <span class="app-name" (click)="goToHome()">Flowboard</span>

        @if (headerService.headerMode() === 'team') {
            <div class="team-detail-section">
                <mat-icon>chevron_right</mat-icon>
                <h2 class="team-title">Product Team</h2>
                <button class="selected">Overview</button>
                <button>Tasks</button>
                <button>Board</button>
                <button>Calendar</button>
                <button>Discuss</button>
            </div>
        }
    </div>

    <div class="user-information-section">
        <img src="assets/icons/bell.png" alt="Notification" class="notification-icon">
        <div class="user-profile">
            <app-default-avatar [name]="'Alex Johnson'" [size]="32" [fontSize]="14"></app-default-avatar>
            <span class="user-name">Alex Johnson</span>
            <img src="assets/icons/arrow-down.png" alt="Dropdown" class="dropdown-icon">
        </div>
    </div>
</div>

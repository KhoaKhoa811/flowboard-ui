<div class="stat-item-container">

    <div class="stat-item-icon" [style.backgroundColor]="iconBackgroundColor">
        <mat-icon [style.color]="iconColor">{{ icon }}</mat-icon>
    </div>
    
    <div class="stat-item-content">
        <h1 class="stat-item-count">{{itemCount}}</h1>
        <span class="stat-item-type">{{itemType}}</span>
    </div>
</div>
